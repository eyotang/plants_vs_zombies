<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>经典啃咬边界验证</title>
<style>body{margin:0;background:#172719;color:#fff1c2;font:14px system-ui}header{padding:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}button{min-height:44px;padding:8px}#host{width:min(100vw,800px);height:min(75vw,600px);margin:auto}pre{white-space:pre-wrap;margin:8px}</style>
<header><button id="outside">19像素重叠</button><button id="inside">20像素重叠</button><b id="status">加载中</b></header><div id="host"></div><pre id="result"></pre>
<script type="module">
import {Game} from '../src/game/model';import {Scene} from '../src/rendering/scene';
const status=document.querySelector('#status'),result=document.querySelector('#result'),g=new Game(9,1),scene=new Scene();
try{
 for(const k of g.config.seeds.slice(0,6))g.chooseSeed(k);g.start();g.select('sunflower');if(!g.plant(0,4))throw new Error('未能合法启动战斗');
 const p=g.plants[0];Object.assign(p,{kind:'wallnut',column:4,row:0,health:4000,actionIn:100000});
 const z=g.spawnZombie('normal',0,430,0);z.speed=0;
 await scene.init(document.querySelector('#host'));await scene.prepareBoard(g,()=>{});scene.setLevel(g);await scene.prepareActors(g,()=>{});scene.app.stop();
 async function draw(){scene.render(g,0,1);scene.app.render();scene.app.stop();
  const overlap=Math.min(Math.trunc(z.x-30)+70,430)-Math.max(Math.trunc(z.x-30)+50,370);
  const clip=scene.actors.get(`z${z.id}`)?.clip;
  if(z.eating!==(overlap>=20)||clip!==(z.eating?'zombie-eat':'zombie-walk'))throw new Error('啃咬判定或绘制状态不一致');
  status.textContent='PASS';result.textContent=JSON.stringify({ticks:g.ticks,x:z.x,overlap,eating:z.eating,plantHealth:p.health,clip,canvas:[scene.app.canvas.width,scene.app.canvas.height],maxFPS:scene.app.ticker.maxFPS},null,2);
 }
 async function contact(x){try{z.x=x;z.biteIn=1;scene.captureMovement();g.step();for(const e of g.drainEvents())scene.event(e);await draw()}catch(e){status.textContent='FAIL';result.textContent=e.stack}}
 document.querySelector('#outside').onclick=()=>contact(391);document.querySelector('#inside').onclick=()=>contact(390);
 await contact(430);document.querySelector('#outside').focus();
}catch(e){status.textContent='FAIL';result.textContent=e.stack}
</script>
