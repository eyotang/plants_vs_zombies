<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>经典冰块覆盖验证</title><style>body{margin:0;background:#172719;color:#fff1c2;font:14px system-ui}header{padding:8px;display:flex;gap:6px;flex-wrap:wrap}button{min-height:44px;padding:8px}#host{width:min(100vw,800px);height:min(75vw,600px);margin:auto}pre{white-space:pre-wrap;margin:8px}</style>
<header><button id="thaw">解冻</button><button id="freeze">再次冰冻</button><button id="release">回收资源</button><b id="status">加载中</b></header><div id="host"></div><pre id="result"></pre><script type="module">
import {Game} from '../src/game/model';import {Scene} from '../src/rendering/scene';import {Assets} from 'pixi.js';
const g=new Game(49,23),scene=new Scene(),status=document.querySelector('#status'),result=document.querySelector('#result'),ice={id:9000,kind:'iceshroom',row:0,column:0,health:300,born:0,shotAt:-100,actionIn:1,awake:true};
try{for(const k of ['sunflower','iceshroom','flowerpot','coffeebean','kernelpult','cabbagepult'])g.chooseSeed(k);g.start();g.select('sunflower');if(!g.plant(0,4))throw Error('未合法启动');g.plants.push(ice);const zs=[g.spawnZombie('normal',0,600,0),g.spawnZombie('football',1,400,0),g.spawnZombie('gargantuar',3,600,0),g.spawnZombie('catapult',4,400,0)];g.step();g.drainEvents();
await scene.init(document.querySelector('#host'));await scene.prepareBoard(g,()=>{});scene.setLevel(g);await scene.prepareActors(g,()=>{});scene.app.stop();let original;
function draw(){scene.render(g,0,1);scene.app.render();scene.app.stop();const data=zs.map(z=>{const actor=scene.actors.get(`z${z.id}`),trap=actor.iceTrap;if(!trap)throw Error('缺少前后两层原版冰块');const [back,front]=[trap.back,trap.front];if(back.visible!==(z.frozenIn>0)||front.visible!==back.visible||front.texture.width!==54||back.texture.height!==30||actor.visual.getChildIndex(back)>=actor.visual.getChildIndex(actor.nativeRig?.root??actor.giantRig.root)||actor.visual.getChildIndex(front)<=actor.visual.getChildIndex(actor.nativeRig?.root??actor.giantRig.root))throw Error('冰块状态、尺寸或层级错误');return {kind:z.kind,frozen:z.frozenIn>0,back:[back.x,back.y,back.scale.x,back.scale.y],front:[front.x,front.y,front.scale.x,front.scale.y],parts:actor.visual.children.length};});const pairs=zs.map(z=>scene.actors.get(`z${z.id}`).iceTrap);if(original&&pairs.some((p,i)=>p!==original[i]))throw Error('重复分配冰块');original??=pairs;status.textContent='PASS';result.textContent=JSON.stringify({phase:zs[0].frozenIn?'frozen':'thawed',data,canvas:[scene.app.canvas.width,scene.app.canvas.height],maxFPS:scene.app.ticker.maxFPS});}
document.querySelector('#thaw').onclick=()=>{try{for(const z of zs)z.frozenIn=0;draw()}catch(e){status.textContent='FAIL';result.textContent=e.stack}};document.querySelector('#freeze').onclick=()=>{try{g.doSpecial({...ice});draw()}catch(e){status.textContent='FAIL';result.textContent=e.stack}};document.querySelector('#release').onclick=async()=>{try{await scene.release();const data={phase:'released',actors:scene.actors.size,effects:scene.effects.length,textures:Object.keys(scene.textures).length,frontCached:!!Assets.get('/assets/runtime/particles/ice-trap-front.png'),backCached:!!Assets.get('/assets/runtime/particles/ice-trap-back.png')};if(data.actors||data.effects||data.textures||data.frontCached||data.backCached)throw Error('冰块未随战斗资源回收');status.textContent='PASS';result.textContent=JSON.stringify(data)}catch(e){status.textContent='FAIL';result.textContent=e.stack}};draw();
}catch(e){status.textContent='FAIL';result.textContent=e.stack}
</script>
