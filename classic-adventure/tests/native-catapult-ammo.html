<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>投篮车备用球验证</title>
<style>body{margin:0;background:#172719;color:#fff1c2;font:14px system-ui}header{padding:8px;display:flex;gap:6px;flex-wrap:wrap}button{min-height:44px;padding:8px}#host{width:min(100vw,800px);height:min(75vw,600px);margin:auto}pre{white-space:pre-wrap;margin:8px}</style>
<header><button data-ammo="20">20 发</button><button data-ammo="4">4 发</button><button data-ammo="3">3 发</button><button data-ammo="2">2 发</button><button data-ammo="1">1 发</button><button data-ammo="0">0 发</button><b id="status">加载中</b></header><div id="host"></div><pre id="result"></pre>
<script type="module">
import {Game} from '../src/game/model';import {Scene} from '../src/rendering/scene';
const g=new Game(49,23),scene=new Scene(),status=document.querySelector('#status'),result=document.querySelector('#result');
try{
 for(const k of ['sunflower','cabbagepult','flowerpot','kernelpult','wallnut','umbrella'])g.chooseSeed(k);g.start();g.select('sunflower');if(!g.plant(0,4))throw new Error('未能合法启动');
 const z=g.spawnZombie('catapult',2,500,0);z.catapult.phase='reload';
 await scene.init(document.querySelector('#host'));await scene.prepareBoard(g,()=>{});scene.setLevel(g);await scene.prepareActors(g,()=>{});scene.app.stop();
 let initial;
 function draw(ammo){z.catapult.ammo=ammo;scene.render(g,0,1);scene.app.render();scene.app.stop();const rig=scene.actors.get(`z${z.id}`).nativeRig,clip=rig.loaded.definition.clips['catapult-idle'];
 const tracks=clip.groups.flatMap((group,gi)=>group.tracks.flatMap((t,i)=>t.name.startsWith('Zombie_catapult_basketball')?[{name:t.name,visible:rig.root.children[gi].children[i].visible}]:[]));
 const count=rig.root.children.reduce((n,g)=>n+g.children.length,0);initial??=count;
 if(tracks.filter(t=>t.visible).length!==Math.min(4,Math.max(0,ammo-1))||count!==initial)throw new Error('备用球或部件数错误');
 status.textContent='PASS';result.textContent=JSON.stringify({ammo,tracks,parts:count,canvas:[scene.app.canvas.width,scene.app.canvas.height],maxFPS:scene.app.ticker.maxFPS});}
 for(const b of document.querySelectorAll('button'))b.onclick=()=>{try{draw(Number(b.dataset.ammo))}catch(e){status.textContent='FAIL';result.textContent=e.stack}};draw(20);
}catch(e){status.textContent='FAIL';result.textContent=e.stack}
</script>
