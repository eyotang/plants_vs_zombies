<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三线射手原生轨迹验证</title>
<style>body{margin:0;background:#172719;color:#fff1c2;font:14px system-ui}header{padding:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}button{min-height:44px;padding:8px}#host{width:min(100vw,800px);height:min(75vw,600px);margin:auto}pre{white-space:pre-wrap;margin:8px}</style>
<header><button id="step">推进34步</button><button id="mobile">390像素预览</button><b id="status">加载中</b></header><div id="host"></div><pre id="result"></pre>
<script type="module">
import {Game} from '../src/game/model';import {Scene} from '../src/rendering/scene';
const g=new Game(31,23),scene=new Scene(),host=document.querySelector('#host'),status=document.querySelector('#status'),result=document.querySelector('#result');let steps=0;
try{
 g.phase='playing';g.started=true;g.waveIn=100000;
 g.plants=[{id:901,kind:'threepeater',row:1,column:1,health:300,actionIn:1,born:0,shotAt:-100}];
 const z=g.spawnZombie('normal',1,850,0);z.speed=0;z.frozenIn=100000;
 await scene.init(host);await scene.prepareBoard(g,()=>{});scene.setLevel(g);await scene.prepareActors(g,()=>{});scene.app.stop();
 g.step();g.zombies=[];g.drainEvents();
 function draw(){scene.render(g,0,1);scene.app.render();scene.app.stop();
  if(g.peas.length!==(steps===0?0:3))throw new Error('子弹数量错误');
  for(const pea of g.peas){const actor=scene.actors.get('b'+pea.id);if(!actor||Math.abs(actor.root.y-pea.originY)>.01)throw new Error('绘制未跟随原生纵向轨迹');}
  if(scene.app.ticker.started||scene.app.canvas.width>800||scene.app.canvas.height>600)throw new Error('渲染预算错误');
  status.textContent='PASS';result.textContent=JSON.stringify({steps,ticks:g.ticks,windup:g.plants[0].threepeaterIn,shots:g.peas.map(p=>({row:p.row,x:p.x,y:p.originY,vy:p.nativePea.vy})),displayObjects:scene.world.children.length,previewWidth:host.clientWidth,canvas:[scene.app.canvas.width,scene.app.canvas.height],maxFPS:scene.app.ticker.maxFPS,tickerStarted:scene.app.ticker.started},null,2);
 }
 document.querySelector('#step').onclick=()=>{try{if(steps>=68)return;for(let n=0;n<34;n++){scene.captureMovement();g.step();g.drainEvents();steps++;}draw()}catch(e){status.textContent='FAIL';result.textContent=e.message+'\n'+e.stack}};
 document.querySelector('#mobile').onclick=()=>{host.style.width='min(100vw,390px)';host.style.height='min(75vw,292.5px)';draw()};draw();
}catch(e){status.textContent='FAIL';result.textContent=e.message+'\n'+e.stack}
</script>
