<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>点燃声音与火球续播验证</title>
<style>body{margin:0;background:#172719;color:#fff1c2;font:14px system-ui}header{padding:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}button{min-height:44px;padding:8px}#host{width:min(100vw,800px);height:min(75vw,600px);margin:auto}textarea{width:100%}</style>
<header><button id="play" disabled>播放点燃并推进动画</button><button id="rebuild" disabled>暂停并重建画面</button><button id="release" disabled>释放资源</button><b id="status">加载中</b></header><div id="host"></div><div id="result"></div>
<script type="module">
import{Game}from'../src/game/model';import{Scene}from'../src/rendering/scene';import{GameAudio}from'../src/platform/audio';import{firePeaShotFrame}from'../src/rendering/projectiles';
const g=new Game(29,23),scene=new Scene(),audio=new GameAudio('/'),status=document.querySelector('#status'),result=document.querySelector('#result'),play=document.querySelector('#play'),rebuild=document.querySelector('#rebuild'),release=document.querySelector('#release');let eventKinds=[],priorFrame=null;
g.phase='playing';g.started=true;g.waveIn=100000;g.seeds=['torchwood'];g.plants=[{id:901,kind:'torchwood',row:0,column:3,health:300,actionIn:0,born:0,shotAt:-100}];const pea={id:902,row:0,x:314,originY:g.gridY(0,0)+24,age:0,ice:false,puff:false,nativePea:{rawX:300,shadowY:g.gridY(0,0)+67}};g.peas=[pea];
const draw=()=>{scene.render(g,0,0);scene.app.render();scene.app.stop()};
function report(extra={}){status.textContent='PASS';const buffer=audio.buffers.get('pea-ignite'),actor=scene.actors.get('b902');const data={ticks:g.ticks,fireAt:pea.fireAt,rate:pea.fireRate,frame:actor?.frame,expectedFrame:firePeaShotFrame(pea,g.ticks),events:eventKinds,decoded:buffer?{duration:buffer.duration,sampleRate:buffer.sampleRate,channels:buffer.numberOfChannels,bytes:buffer.length*buffer.numberOfChannels*4}:null,canvas:[scene.app.canvas.width,scene.app.canvas.height],...extra};result.replaceChildren(...Object.entries(data).map(([key,value])=>{const line=document.createElement('textarea');line.readOnly=true;line.rows=1;line.setAttribute('aria-label',key);line.value=JSON.stringify(value);return line}));}
function fail(e){status.textContent='FAIL';result.textContent=e.message+'\n'+e.stack}
try{await scene.init(document.querySelector('#host'));await scene.prepareBoard(g,()=>{});scene.setLevel(g);await scene.prepareActors(g,()=>{});scene.app.stop();draw();play.disabled=false;release.disabled=false;report();
play.onclick=async()=>{try{play.disabled=true;await audio.unlock(g);for(let n=0;n<17;n++){g.step();for(const e of g.drainEvents()){eventKinds.push(e.kind);audio.play(e.kind,e.kind==='hit'?e.impact:undefined)}draw();}if(eventKinds.filter(k=>k==='pea-ignite').length!==1)throw Error('点燃声音事件次数错误');if(scene.actors.get('b902').frame!==firePeaShotFrame(pea,g.ticks))throw Error('火球相位错误');rebuild.disabled=false;report()}catch(e){fail(e)}};
rebuild.onclick=async()=>{try{g.phase='paused';draw();priorFrame=scene.actors.get('b902').frame;await scene.clearResources();await scene.prepareBoard(g,()=>{});scene.setLevel(g);await scene.prepareActors(g,()=>{});draw();const after=scene.actors.get('b902').frame;if(after!==priorFrame||after!==firePeaShotFrame(pea,g.ticks))throw Error('重建后火球从头播放');report({beforeFrame:priorFrame,afterFrame:after,rebuildPreserved:true});}catch(e){fail(e)}};
release.onclick=async()=>{try{await audio.release();await scene.clearResources();play.disabled=true;rebuild.disabled=true;release.disabled=true;if(audio.buffers.size||audio.sources.size||scene.actors.size)throw Error('资源未释放');report({released:true,buffers:audio.buffers.size,voices:audio.sources.size,actors:scene.actors.size});}catch(e){fail(e)}};
}catch(e){fail(e)}
</script>
