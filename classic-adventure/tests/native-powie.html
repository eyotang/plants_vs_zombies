<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>经典爆炸粒子验证</title>
<style>body{margin:0;background:#172719;color:#fff1c2;font:14px system-ui}header{padding:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}button{min-height:44px;padding:8px}#host{width:min(100vw,800px);height:min(75vw,600px);margin:auto}pre{white-space:pre-wrap;margin:8px}</style>
<header><button id="step">触发爆炸</button><button id="peak">推进20步</button><button id="clear">释放效果</button><button id="bench">效果压力检查</button><b id="status">加载中</b></header><div id="host"></div><pre id="result"></pre>
<script type="module">
import {Game} from '../src/game/model';import {Scene} from '../src/rendering/scene';
const g=new Game(49,23),scene=new Scene(),status=document.querySelector('#status'),result=document.querySelector('#result');let steps=0,explosions=0,benchmark;
try{
 for(const k of ['sunflower','cherrybomb','flowerpot','kernelpult','wallnut','umbrella'])g.chooseSeed(k);g.start();g.select('sunflower');if(!g.plant(0,4))throw new Error('未能合法启动战斗');
 const bomb=g.plants.at(-1),pot=g.plants.find(p=>p.kind==='flowerpot'&&p.column===0&&p.row===2);Object.assign(bomb,{kind:'cherrybomb',column:4,row:2,actionIn:1000});pot.column=4;
 const z=g.spawnZombie('catapult',2,430,0);z.speed=0;z.catapult.ammo=0;
 await scene.init(document.querySelector('#host'));await scene.prepareBoard(g,()=>{});scene.setLevel(g);await scene.prepareActors(g,()=>{});scene.app.stop();
 const powies=()=>scene.effects.filter(e=>e.powie),sprites=()=>powies().reduce((n,e)=>n+e.node.children.length,0);
 function frame(n){for(let i=0;i<n;i++){scene.captureMovement();g.step();steps++;for(const e of g.drainEvents()){if(e.kind==='explode')explosions++;scene.event(e)}}scene.render(g,0,1);scene.app.render();scene.app.stop()}
 function draw(){scene.render(g,0,1);scene.app.render();scene.app.stop();const effects=powies();
  if(bomb.health!==(steps?0:300)||pot.health!==(steps?0:300)||z.health!==(steps?-950:850)||explosions!==(steps?1:0)||g.kills!==(steps?1:0))throw new Error('受压爆炸结果不一致');
  if(steps===1&&(effects.length!==1||effects[0].node.children.length!==29)||steps===21&&(effects.length!==1||effects[0].node.children.filter(s=>s.visible).length!==29)||steps>=201&&effects.length)throw new Error('粒子数量或释放时间错误');
  if(scene.textures.powieCloud.width!==80||scene.textures.powieWord.width!==200)throw new Error('粒子未按原生尺寸加载');
  status.textContent='PASS';result.textContent=JSON.stringify({steps,bomb:bomb.health,pot:pot.health,vehicle:z.health,explosions,kills:g.kills,effects:effects.length,sprites:sprites(),visible:effects.reduce((n,e)=>n+e.node.children.filter(s=>s.visible).length,0),origin:effects[0]?[effects[0].node.x,effects[0].node.y]:null,textureSize:[scene.textures.powieCloud.width,scene.textures.powieWord.width],canvas:[scene.app.canvas.width,scene.app.canvas.height],maxFPS:scene.app.ticker.maxFPS,benchmark});
 }
 const safe=fn=>()=>{try{fn();draw()}catch(e){status.textContent='FAIL';result.textContent=e.stack}};
 document.querySelector('#step').onclick=safe(()=>{if(!steps)frame(1)});
 document.querySelector('#peak').onclick=safe(()=>{if(steps===1)frame(20)});
 document.querySelector('#clear').onclick=safe(()=>{if(steps>0&&steps<201)frame(201-steps)});
 document.querySelector('#bench').onclick=safe(()=>{if(steps<201||benchmark)return;
  const measure=()=>{const times=[];let peak=0;for(let i=0;i<100;i++){const t=performance.now();frame(2);times.push(performance.now()-t);peak=Math.max(peak,sprites())}return {meanMs:times.reduce((a,b)=>a+b,0)/times.length,p95Ms:times.sort((a,b)=>a-b)[94],peakSprites:peak}};
  const baseline=measure();for(let i=0;i<8;i++)scene.event({kind:'explode',effect:'powie',tick:g.ticks,x:120+i*75,y:180+(i%3)*100});const burst=measure();benchmark={framesPerRun:100,logicStepsPerFrame:2,simultaneousExplosions:8,baseline,burst,remainingPowie:powies().length};
 });
 draw();document.querySelector('#step').focus();
}catch(e){status.textContent='FAIL';result.textContent=e.stack}
</script>
