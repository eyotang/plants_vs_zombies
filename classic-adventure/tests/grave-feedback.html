<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>清墓反馈检查</title>
<style>body{margin:0;background:#25291d;color:white;font:14px system-ui}header{padding:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}button{padding:8px}#host{width:min(100vw,800px);aspect-ratio:4/3}pre{white-space:pre-wrap;padding:8px}</style>
<header><button id="step">推进1次</button><button id="step10">推进10次</button><button id="bench">检查100帧</button><button id="audio">播放啃食音</button><button id="pause">暂停/继续</button><button id="release">释放</button><b id="status">准备中</b></header><div id="host"></div><pre id="result"></pre>
<script type="module">
import{Game}from'../src/game/model';import{Scene}from'../src/rendering/scene';import{GameAudio}from'../src/platform/audio';
const g=new Game(14,1),scene=new Scene(),audio=new GameAudio('/'),ages=[57,157,357,456],plants=[];let benchmark,steps=0,released=false;
if(new URLSearchParams(location.search).has('mobile'))document.querySelector('#host').style.width='min(100vw,calc((100vh - 76px)*4/3))';
for(const[i,age]of ages.entries()){
 const sample=new Game(14,1);for(const k of ['gravebuster','puffshroom','sunflower','wallnut','peashooter','cherrybomb'])sample.chooseSeed(k);sample.start();sample.sun=1000;sample.random=()=>.5;
 const grave=sample.graves[0];sample.select('gravebuster');if(!sample.plant(grave.column,grave.row))throw Error('plant failed');delete sample.random;for(let t=0;t<age;t++)sample.step();
 const p=sample.plants[0];p.id=9000+i;p.column=i%2?6:2;p.row=i<2?1:3;plants.push(p);
}
g.phase='playing';g.started=true;g.ticks=456;g.plants=plants;g.seeds=['gravebuster'];g.graves=plants.map(p=>({id:p.id+100,row:p.row,column:p.column}));g.zombies=[];
try{await scene.init(document.querySelector('#host'));await scene.prepareBoard(g,()=>{});scene.setLevel(g);await scene.prepareActors(g,()=>{});scene.app.stop();
 const count=()=>{let n=0;const visit=c=>{n++;for(const x of c.children??[])visit(x)};visit(scene.app.stage);return n};
 function draw(){if(!released){scene.render(g,0,0);scene.app.render();scene.app.stop();}
 const rocks=[...scene.actors.values()].filter(a=>a.debris).reduce((n,a)=>n+a.debris.root.children.filter(p=>p.visible).length,0),dirt=scene.effects.filter(e=>e.debris).reduce((n,e)=>n+e.node.children.filter(p=>p.visible).length,0);
 const errors=plants.filter((p,i)=>{const elapsed=ages[i]+steps,expected=Math.max(0,457-elapsed);return(expected>0)!==g.plants.includes(p)||expected>0&&p.actionIn!==expected}).length;
 const buffer=audio.buffers.get('grave-chomp'),pcm=buffer?buffer.length*buffer.numberOfChannels*4:0;
 document.querySelector('#status').textContent=errors?'FAIL':'PASS';document.querySelector('#result').textContent=JSON.stringify({viewport:[innerWidth,innerHeight],steps,errors,plants:g.plants.length,rocks,dirt,actors:scene.actors.size,objects:count(),canvas:[scene.app.canvas.width,scene.app.canvas.height],maxFPS:scene.app.ticker.maxFPS,audio:{state:audio.context?.state??'none',duration:buffer?.duration,pcm,voices:audio.voices,pauseGain:audio.pauseOutput?.gain.value,buffers:audio.buffers.size},benchmark});}
 function advance(n){if(g.phase==='playing'&&!released){for(let i=0;i<n;i++){g.step();steps++;for(const event of g.drainEvents())scene.event(event)}}draw()}
 document.querySelector('#step').onclick=()=>advance(1);document.querySelector('#step10').onclick=()=>advance(10);
 document.querySelector('#bench').onclick=()=>{const before=count(),times=[];for(let i=0;i<100;i++){const t=performance.now();scene.render(g,0,0);scene.app.render();times.push(performance.now()-t)}times.sort((a,b)=>a-b);benchmark={frames:100,meanMs:times.reduce((a,b)=>a+b)/100,p95Ms:times[94],objectsAdded:count()-before};draw()};
 document.querySelector('#audio').onclick=async()=>{await audio.unlock(g);audio.play('grave-chomp');draw()};
 document.querySelector('#pause').onclick=()=>{if(g.phase==='playing')g.pause();else g.resume();audio.setPaused(g.phase==='paused');draw()};
 document.querySelector('#release').onclick=async()=>{await audio.release();await scene.release();released=true;draw()};draw();
}catch(e){document.querySelector('#status').textContent='ERROR';document.querySelector('#result').textContent=e.stack}
</script>
