<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>跳跳断杆下落验证</title><style>body{margin:0;background:#172719;color:#fff1c2;font:14px system-ui}header{padding:8px;display:flex;gap:6px;flex-wrap:wrap}button{min-height:44px;padding:8px}#host{width:min(100vw,800px);height:min(75vw,600px);margin:auto}pre{white-space:pre-wrap;margin:8px}</style>
<header><button data-t="1">断杆</button><button data-t="20">下落20步</button><button data-t="59">落地</button><b id="status">加载中</b></header><div id="host"></div><pre id="result"></pre><script type="module">
import {Game} from '../src/game/model';import {Scene} from '../src/rendering/scene';
const g=new Game(49,23),scene=new Scene(),status=document.querySelector('#status'),result=document.querySelector('#result');
try{for(const k of ['sunflower','cabbagepult','flowerpot','kernelpult','magnetshroom','umbrella'])g.chooseSeed(k);g.start();g.select('sunflower');if(!g.plant(0,4))throw Error('未合法启动');const magnets=[1,3].map((r,i)=>({id:9000+i,kind:'magnetshroom',row:r,column:1,health:300,born:0,shotAt:-100,actionIn:100000,awake:true}));g.plants.push(...magnets);const zs=[g.spawnZombie('pogo',1,260,0),g.spawnZombie('pogo',3,260,0)];for(const [i,z] of zs.entries()){z.pogoState={phase:'high',remaining:40,altitude:59,animTime:1};z.chillIn=i?10000:0;}
await scene.init(document.querySelector('#host'));await scene.prepareBoard(g,()=>{});scene.setLevel(g);await scene.prepareActors(g,()=>{});scene.app.stop();
function draw(){scene.render(g,0,1);scene.app.render();scene.app.stop();const data=zs.map(z=>{const a=scene.actors.get(`z${z.id}`),s=z.pogoState,sourceY=40+85*z.row+Math.max(0,440-(z.x+10))*.25-16;if(s.altitude!==59-g.ticks||Math.abs(a.root.y-(sourceY+8-s.altitude))>1e-7||!a.nativeAligned||z.pogo!==(g.ticks===0))throw Error('下落高度或原生绘制根不一致');return {x:z.x,phase:s.phase,altitude:s.altitude,bodyTop:g.zombieBodyTop(z),root:[a.root.x,a.root.y],parts:a.nativeRig.root.children.reduce((n,g)=>n+g.children.length,0)};});status.textContent='PASS';result.textContent=JSON.stringify({tick:g.ticks,normal:data[0],chilled:data[1],canvas:[scene.app.canvas.width,scene.app.canvas.height],maxFPS:scene.app.ticker.maxFPS});}
for(const b of document.querySelectorAll('button'))b.onclick=()=>{try{for(const p of magnets)if(g.ticks===0)p.actionIn=0;while(g.ticks<Number(b.dataset.t)){scene.captureMovement();g.step();g.drainEvents();}draw()}catch(e){status.textContent='FAIL';result.textContent=e.stack}};draw();
}catch(e){status.textContent='FAIL';result.textContent=e.stack}
</script>
