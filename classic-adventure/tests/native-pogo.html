<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>原生跳跳时序验证</title><style>body{margin:0;background:#172719;color:#fff1c2;font:14px system-ui}header{padding:8px;display:flex;gap:6px;flex-wrap:wrap}button{min-height:44px;padding:8px}#host{width:min(100vw,800px);height:min(75vw,600px);margin:auto}pre{white-space:pre-wrap;margin:8px}</style>
<header><button data-t="1">蓄跳开始</button><button data-t="41">最高点</button><button data-t="81">向前跳</button><button data-t="121">越过植物</button><b id="status">加载中</b></header><div id="host"></div><pre id="result"></pre><script type="module">
import {Game} from '../src/game/model';import {Scene} from '../src/rendering/scene';
const g=new Game(44,23),scene=new Scene(),status=document.querySelector('#status'),result=document.querySelector('#result');
try{for(const k of ['sunflower','cabbagepult','flowerpot','squash','cherrybomb','tallnut'])g.chooseSeed(k);g.start();g.select('sunflower');if(!g.plant(2,1))throw Error('未合法启动');const p=g.plants.at(-1);p.actionIn=100000;g.plants.push({...p,id:9000,row:3});const zs=[g.spawnZombie('pogo',1,260,0),g.spawnZombie('pogo',3,260,0)];for(const [i,z] of zs.entries()){z.pogoState={phase:'bounce',remaining:1,altitude:9,animTime:1};z.chillIn=i?10000:0;}
await scene.init(document.querySelector('#host'));await scene.prepareBoard(g,()=>{});scene.setLevel(g);await scene.prepareActors(g,()=>{});scene.app.stop();
function draw(){scene.render(g,0,1);scene.app.render();scene.app.stop();const data=zs.map(z=>{const a=scene.actors.get(`z${z.id}`),s=z.pogoState,y=g.nativeGroundY(z)-8+16-s.altitude;if(!a.nativeAligned||Math.abs(a.root.y-y)>1e-7||Math.abs(a.nativeRig.lastTicks-s.animTime*100)>1e-7)throw Error('高度或动画时钟不一致');return {x:z.x,phase:s.phase,counter:s.remaining,altitude:s.altitude,anim:s.animTime,bodyTop:g.zombieBodyTop(z),root:[a.root.x,a.root.y],parts:a.nativeRig.root.children.reduce((n,g)=>n+g.children.length,0)};});if(g.ticks===41&&data.some(z=>z.x!==260||z.phase!=='high'||z.altitude!==59))throw Error('蓄跳最高点错误');status.textContent='PASS';result.textContent=JSON.stringify({tick:g.ticks,normal:data[0],chilled:data[1],canvas:[scene.app.canvas.width,scene.app.canvas.height],maxFPS:scene.app.ticker.maxFPS});}
for(const b of document.querySelectorAll('button'))b.onclick=()=>{try{while(g.ticks<Number(b.dataset.t)){scene.captureMovement();g.step();g.drainEvents();}draw()}catch(e){status.textContent='FAIL';result.textContent=e.stack}};scene.captureMovement();g.step();g.drainEvents();draw();
}catch(e){status.textContent='FAIL';result.textContent=e.stack}
</script>
