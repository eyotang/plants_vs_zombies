<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>经典豌豆碰撞验证</title>
<style>body{margin:0;background:#172719;color:#fff1c2;font:14px system-ui}header{padding:8px;display:flex;gap:8px;align-items:center}button{min-height:44px;padding:8px}#host{width:min(100vw,800px);height:min(75vw,600px);margin:auto}pre{white-space:pre-wrap;margin:8px}</style>
<header><button id="step">推进一步</button><b id="status">加载中</b></header><div id="host"></div><pre id="result"></pre>
<script type="module">
import {Game} from '../src/game/model';import {Scene} from '../src/rendering/scene';
const g=new Game(9,1),scene=new Scene(),status=document.querySelector('#status'),result=document.querySelector('#result');let steps=0,hits=0;
try{
 for(const k of g.config.seeds.slice(0,6))g.chooseSeed(k);g.start();g.select('sunflower');if(!g.plant(0,4))throw new Error('未能合法启动战斗');
 const p=g.plants[0];Object.assign(p,{kind:'peashooter',row:0,column:0,actionIn:100000});
 const z=g.spawnZombie('normal',0,400.75,0);z.speed=0;z.frozenIn=10000;
 g.peas=[{id:999,row:0,x:379.99,age:0,ice:false,puff:false}];
 await scene.init(document.querySelector('#host'));await scene.prepareBoard(g,()=>{});scene.setLevel(g);await scene.prepareActors(g,()=>{});scene.app.stop();
 function draw(){scene.render(g,0,1);scene.app.render();scene.app.stop();const bullet=scene.actors.get('b999'),size=bullet?[bullet.art.width,bullet.art.height]:null;
  if(steps<=1&&(size?.[0]!==28||size?.[1]!==28))throw new Error('豌豆未使用原生28像素尺寸');
  if(z.health!==(steps<2?270:250)||hits!==(steps<2?0:1))throw new Error('命中时序或伤害错误');
  status.textContent='PASS';result.textContent=JSON.stringify({steps,ticks:g.ticks,health:z.health,hits,projectiles:g.peas.length,bulletSize:size,canvas:[scene.app.canvas.width,scene.app.canvas.height],maxFPS:scene.app.ticker.maxFPS},null,2);
 }
 document.querySelector('#step').onclick=()=>{try{if(steps>=2)return;scene.captureMovement();g.step();steps++;for(const e of g.drainEvents()){if(e.kind==='hit')hits++;scene.event(e)}draw()}catch(e){status.textContent='FAIL';result.textContent=e.stack}};
 draw();document.querySelector('#step').focus();
}catch(e){status.textContent='FAIL';result.textContent=e.stack}
</script>
