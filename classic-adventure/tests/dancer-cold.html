<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>舞团减速与定身动画验证</title><style>body{margin:0;background:#172719;color:#fff1c2;font:14px system-ui}header{display:flex;gap:8px;padding:8px;flex-wrap:wrap}button{min-height:44px;padding:8px}#host{width:min(100vw,800px);height:min(75vw,600px);margin:auto}textarea{width:100%}</style>
<header><button id="run" disabled>验证舞团与定身动画</button><button id="mobile">390像素预览</button><button id="release" disabled>释放资源</button></header><div id="host"></div><div id="result">加载中</div>
<script>addEventListener('error',e=>document.querySelector('#result').textContent='FAIL: '+e.message);</script>
<script type="module">
import{Game}from'../src/game/model';import{Scene}from'../src/rendering/scene';import{walkingSpeed}from'../src/game/zombie-motion';
let g=new Game(19,23);const scene=new Scene(),host=document.querySelector('#host'),result=document.querySelector('#result');g.phase='playing';g.started=true;g.waveIn=100000;
const spawn=(kind,row,x)=>{const z=g.spawnZombie(kind,row,x,0);z.speed=.4;z.riseIn=0;z.frozenIn=0;z.butterIn=0;if(kind==='dancer'){z.dancePhase='dance';z.danceIn=0;z.summonIn=1000;}return z};
const leader=spawn('dancer',2,580),a=spawn('backup',1,580),b=spawn('backup',3,580);a.leader=b.leader=leader.id;a.slot=0;b.slot=1;a.chillIn=200;
const butter=spawn('normal',0,350),ice=spawn('normal',4,350),warm=spawn('normal',4,660);butter.butterIn=200;ice.chillIn=200;const ids=[leader,a,b,butter,ice,warm].map(z=>z.id),initial=g.snapshot();
const timelines=new Map(),animate=scene.animate;scene.animate=function(actor,clip,loop,timeline,...rest){timelines.set(actor,timeline);return animate.call(this,actor,clip,loop,timeline,...rest)};
function output(data){result.replaceChildren(...Object.entries(data).map(([key,value])=>{const t=document.createElement('textarea');t.readOnly=true;t.rows=1;t.setAttribute('aria-label',key);t.value=JSON.stringify(value);return t}));}
const actors=()=>ids.map(id=>scene.actors.get('z'+id));const parts=()=>actors().flatMap(a=>a.nativeRig?a.nativeRig.root.children.flatMap(g=>g.children):[a.art]);
function draw(alpha=0){scene.render(g,0,alpha);scene.app.render();scene.app.stop()};const fail=e=>output({status:'FAIL',error:e.message});
try{await scene.init(host);await scene.prepareBoard(g,()=>{});scene.setLevel(g);await scene.prepareActors(g,()=>{});draw();document.querySelector('#run').disabled=false;document.querySelector('#release').disabled=false;output({status:'READY',actors:actors().length});
document.querySelector('#run').onclick=()=>{try{g=Game.restore(structuredClone(initial));draw();const before=new Set(parts());for(let n=0;n<30;n++){scene.captureMovement();g.step();g.drainEvents();draw();}const zs=ids.map(id=>g.zombies.find(z=>z.id===id)),factors=zs.map(z=>g.zombieAnimationFactor(z));if(JSON.stringify(factors)!=='[0.5,0.5,0.5,0,0.5,1]')throw Error('舞团或定身动画倍率错误');for(const z of zs.slice(0,3))if(Math.abs(580-z.x-30*walkingSpeed(z)*.4)>1e-7)throw Error('舞团速度不一致');draw(0);const base=actors().map(a=>timelines.get(a));draw(.8);const advances=actors().map((a,i)=>Math.round((timelines.get(a)-base[i])*1000)/1000);if(JSON.stringify(advances)!=='[0.4,0.4,0.4,0,0.4,0.8]')throw Error('渲染插值未遵守定身/减速: '+JSON.stringify({base,advances}));if(!parts().every(p=>before.has(p)))throw Error('重复分配角色部件');output({status:'PASS',factors,interpolationAdvances:advances,groupX:zs.slice(0,3).map(z=>z.x),ownChill:zs.slice(0,3).map(z=>z.chillIn),parts:parts().length,replacedParts:0,canvas:[scene.app.canvas.width,scene.app.canvas.height],maxFPS:scene.app.ticker.maxFPS,scope:'实际Scene与Game.step，当前匀速移动桥接保持0.4；非原版ground轨迹/真机性能验收'});}catch(e){fail(e)}};
document.querySelector('#mobile').onclick=()=>{host.style.width='min(100vw,390px)';host.style.height='min(75vw,292.5px)';draw()};document.querySelector('#release').onclick=async()=>{try{await scene.clearResources();output({status:'RELEASED',actors:scene.actors.size,pool:scene.projectilePool.length})}catch(e){fail(e)}};
}catch(e){fail(e)}
</script>
