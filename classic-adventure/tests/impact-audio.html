<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>经典音效检查</title>
<style>body{background:#20311f;color:#fff0c8;font:16px/1.6 system-ui;max-width:800px;margin:30px auto;padding:16px}button{padding:12px 20px;font:inherit}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style>
<h1>专用命中音效检查</h1><p>测试页面，仅供核对浏览器中的真实解码、播放与缓冲复用。</p><button id="run">播放并检查十一段命中音效</button><pre id="result">等待点击</pre><details><summary>测量详情</summary><pre id="measurements"></pre></details>
<script type="module">
import {GameAudio} from '../src/platform/audio';import {Game} from '../src/game/model';
const Native=window.AudioContext,stats={contexts:0,gains:0,ended:0,played:[]};let pending=[];
class Measured extends Native{
 constructor(...args){super(...args);stats.contexts++;}
 createGain(){stats.gains++;return super.createGain();}
 createBufferSource(){const source=super.createBufferSource(),start=source.start.bind(source);
  source.start=(...args)=>{stats.played.push({frames:source.buffer.length,rate:source.buffer.sampleRate,channels:source.buffer.numberOfChannels,duration:source.buffer.duration});pending.push(new Promise(resolve=>source.addEventListener('ended',()=>{stats.ended++;resolve();},{once:true})));return start(...args);};return source;
 }
}
window.AudioContext=Measured;
document.querySelector('#run').onclick=async()=>{
 const result=document.querySelector('#result');document.querySelector('#run').disabled=true;result.textContent='正在解码…';const originalRandom=Math.random;
 try{
  const game=new Game(49,1);game.seeds=['torchwood','kernelpult','melonpult'];const audio=new GameAudio('/');await audio.unlock(game);
  for(const [kind,value] of [['shield',0],['shield',.999],['plastic',0],['plastic',.999],['ignite',0],['ignite',.999],['kernel',0],['kernel',.999],['butter',0],['melon',0],['melon',.999]]){Math.random=()=>value;audio.play('hit',[kind]);await Promise.all(pending);}
  Math.random=originalRandom;await Promise.all(pending);
  const before=performance.getEntriesByType('resource').filter(e=>e.name.endsWith('.mp3')).length;await audio.unlock(game);const after=performance.getEntriesByType('resource').filter(e=>e.name.endsWith('.mp3')).length;
  if(stats.played.length!==11||stats.ended!==11||stats.contexts!==1||stats.gains!==2||before!==after)throw new Error('音效播放或缓冲复用检查失败 '+JSON.stringify({...stats,before,after}));
  result.textContent='PASS · 十一段专用命中音效均已播放，重复使用没有额外下载。';document.querySelector('#measurements').textContent=JSON.stringify({...stats,repeatUnlockExtraRequests:after-before},null,2);
 }catch(error){result.textContent='FAIL\n'+error.stack;}finally{Math.random=originalRandom;}
};
</script>
