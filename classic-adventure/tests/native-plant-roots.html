<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>植物原生根坐标检查</title>
<style>body{margin:0;background:#25291d;color:white;font:14px system-ui}header{padding:6px;display:flex;gap:12px;align-items:center}a{color:#fff}button{padding:6px}#host{width:min(100vw,800px);aspect-ratio:4/3}pre{white-space:pre-wrap;padding:8px}</style>
<header><a href="?scene=day">白天</a><a href="?scene=pool">泳池</a><a href="?scene=roof">屋顶</a><button id="bench">检查重复绘制</button><b id="status">准备中</b></header><div id="host"></div><pre id="result"></pre>
<script type="module">
import {Game}from'../src/game/model';import{Scene}from'../src/rendering/scene';import{Graphics}from'pixi.js';
const env=new URLSearchParams(location.search).get('scene')??'roof',g=new Game(env==='roof'?49:env==='pool'?29:9,23),scene=new Scene();let benchmark;
if(new URLSearchParams(location.search).has('mobile'))document.querySelector('#host').style.width='min(100vw, calc((100vh - 48px) * 4 / 3))';
const kinds=['peashooter','sunflower','wallnut','plantern','potatomine','puffshroom','scaredyshroom','chomper','coffeebean','pumpkin','starfruit','cactus'];
g.phase='playing';g.ticks=37;g.seeds=g.config.seeds.slice(0,6);g.plants=[];
const samples=kinds.map((kind,i)=>({id:9001+i,kind,row:i<6?1:3,column:i%6+1,health:300,actionIn:1000,born:0,shotAt:-100,awake:true,...(kind==='chomper'?{chomp:{phase:'ready',remaining:0}}:{})}));
for(const p of samples){if(env==='roof')g.plants.push({...p,id:p.id+100,kind:'flowerpot'});g.plants.push(p);}
// Independent Plant::UpdateReanim / PlantDrawHeightOffset constants, not a native-game pixel oracle.
function expected(p){let dy=({flowerpot:26,lilypad:25,starfruit:10,tanglekelp:24,seashroom:28,coffeebean:-20,pumpkin:15,puffshroom:5,scaredyshroom:-14,gravebuster:-40})[p.kind]??0;
 if(env==='roof'&&p.kind!=='flowerpot')dy+=p.kind==='chomper'||p.kind==='plantern'?-10:p.kind==='scaredyshroom'?0:-5;
 if(g.waterRow(p.row)&&p.kind!=='coffeebean')dy+=Math.sin(p.row*Math.PI+p.column*.25*Math.PI+37*2*Math.PI/200)*2;
 if(p.kind==='coffeebean')dy+=10;if(p.kind==='potatomine')dy+=12;
 return{x:40+p.column*80+(['coffeebean','potatomine'].includes(p.kind)?12:0),y:g.gridY(p.column,p.row)+dy,scale:['coffeebean','potatomine'].includes(p.kind)?.8:1};}
try{await scene.init(document.querySelector('#host'));await scene.prepareBoard(g,()=>{});scene.setLevel(g);await scene.prepareActors(g,()=>{});scene.app.stop();
 function draw(){scene.render(g,0,1);scene.app.render();scene.app.stop();const results=samples.map(p=>{const a=scene.actors.get('p'+p.id),rig=a.rig??a.nativeRig,e=expected(p);return{kind:p.kind,actual:[a.root.x+rig.root.x,a.root.y+rig.root.y,rig.root.scale.x,rig.root.scale.y],expected:[e.x,e.y,e.scale,e.scale]}});const mismatches=results.filter(r=>r.actual.some((n,i)=>Math.abs(n-r.expected[i])>1e-6));document.querySelector('#status').textContent=mismatches.length?'FAIL':'PASS';document.querySelector('#result').textContent=JSON.stringify({env,viewport:[innerWidth,innerHeight],maxFPS:scene.app.ticker.maxFPS,samples:results.length,mismatches:mismatches.length,maxPositionError:Math.max(...results.flatMap(r=>r.actual.slice(0,2).map((n,i)=>Math.abs(n-r.expected[i])))),maxScaleError:Math.max(...results.map(r=>Math.abs(r.actual[2]-r.expected[2]))),actors:scene.actors.size,canvas:[scene.app.canvas.width,scene.app.canvas.height],benchmark});}
 document.querySelector('#bench').onclick=()=>{const times=[];for(let i=0;i<100;i++){const t=performance.now();scene.render(g,0,1);scene.app.render();times.push(performance.now()-t)}times.sort((a,b)=>a-b);benchmark={frames:100,meanMs:times.reduce((a,b)=>a+b)/100,p95Ms:times[94]};draw()};draw();
}catch(e){document.querySelector('#status').textContent='ERROR';document.querySelector('#result').textContent=e.stack}
</script>
