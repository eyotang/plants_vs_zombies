<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>啃食存档与画面重建验证</title><style>body{margin:0;background:#172719;color:#fff1c2;font:14px system-ui}header{display:flex;gap:8px;padding:8px;flex-wrap:wrap}button{min-height:44px;padding:8px}#host{width:min(100vw,800px);height:min(75vw,600px);margin:auto}textarea{width:100%}</style><header><button id="run" disabled>验证暂停存档和重建</button><button id="mobile">390像素预览</button><button id="release" disabled>释放资源</button></header><div id="host"></div><div id="result">加载中</div><script>addEventListener('error',e=>document.querySelector('#result').textContent='FAIL: '+e.message);</script><script type="module">
import{Game}from'../src/game/model';import{Scene}from'../src/rendering/scene';import{cellX}from'../src/game/config';import reference from'./helpers/eat-clock-reference.json';
let g=new Game(9,23);const scene=new Scene(),host=document.querySelector('#host'),result=document.querySelector('#result');g.phase='playing';g.started=true;g.waveIn=1e9;
for(const[row,kind]of['normal','cone','bucket','door'].entries()){g.plants.push({id:900+row,kind:'wallnut',row,column:3,health:4000,born:0,shotAt:-100,actionIn:0});for(const cold of[false,true]){const z=g.spawnZombie(kind,row,cellX(3)-10,0);z.speed=.3;z.chillIn=cold?1000000:0;}}
const ids=g.zombies.map(z=>z.id),initial=g.snapshot(),times=new Map(),blendWeights=new Map(),animate=scene.animate;scene.animate=function(actor,...args){times.set(actor,args[7]);blendWeights.set(actor,args[9]);return animate.call(this,actor,...args)};
function output(data){result.replaceChildren(...Object.entries(data).map(([key,value])=>{const t=document.createElement('textarea');t.readOnly=true;t.rows=1;t.setAttribute('aria-label',key);t.value=JSON.stringify(value);return t}));}
const actors=()=>ids.map(id=>scene.actors.get('z'+id)),parts=()=>actors().flatMap(a=>a.nativeRig.root.children.flatMap(g=>g.children)),poses=()=>parts().map(p=>p.visible?[p.x,p.y,p.scale.x,p.scale.y,p.skew.x,p.skew.y,p.alpha,true,p.texture.frame.x,p.texture.frame.y]:[false]);function draw(alpha=1){scene.render(g,0,alpha);scene.app.render();scene.app.stop()};const fail=e=>output({status:'FAIL',error:e.message});
try{await scene.init(host);output({status:"BOARD"});await scene.prepareBoard(g,(done,total)=>output({status:"BOARD",done,total}));scene.setLevel(g);output({status:"ACTORS"});await scene.prepareActors(g,(done,total)=>output({status:"ACTORS",done,total}));draw();document.querySelector('#run').disabled=false;document.querySelector('#release').disabled=false;output({status:'READY',actors:actors().length});
document.querySelector('#run').onclick=()=>{try{g=Game.restore(structuredClone(initial));draw();const original=new Set(parts()),frameStorage=actors().map(a=>a.nativeRig.sourceFrame);for(let n=0;n<17;n++){scene.captureMovement();g.step();g.drainEvents();draw();}const blends=g.zombies.map(z=>z.bodyBlend?.left);if(blends.some(left=>left!==3))throw Error("20步过渡倒计时不正确");const phases=g.zombies.map(z=>z.eatTime);for(let i=0;i<phases.length;i++)if(phases[i]!==reference.find(r=>r.rate===(i%2?18:36)&&r.tick===17).time)throw Error('啃食时钟不符合C++算例');if(!parts().every(p=>original.has(p)))throw Error('啃食时逐帧新建了部件');if(actors().some((a,i)=>a.nativeRig.sourceFrame!==frameStorage[i]))throw Error('取帧临时对象被反复新建');draw(0);const previous=actors().map(a=>times.get(a));draw(.5);const middle=actors().map(a=>times.get(a));draw(1);const next=actors().map(a=>times.get(a));if(middle.some((v,i)=>Math.abs(v-(previous[i]+next[i])/2)>1e-9))throw Error('啃食插值进度不一致');g.pause();const saved=g.snapshot();for(let n=0;n<10;n++)g.step();if(JSON.stringify(saved)!==JSON.stringify(g.snapshot()))throw Error('暂停后时钟仍推进');draw();const before=JSON.stringify(poses());g=Game.restore(saved);scene.setLevel(g);draw();if(before!==JSON.stringify(poses())){const a=JSON.parse(before),b=poses(),index=a.findIndex((p,i)=>JSON.stringify(p)!==JSON.stringify(b[i]));throw Error('存档重建姿势差异: '+JSON.stringify({index,before:a[index],after:b[index]}))};if(JSON.stringify(saved)!==JSON.stringify(g.snapshot()))throw Error("绘制改变了存档");g.resume();for(let n=0;n<3;n++){scene.captureMovement();g.step();draw(.5);}if(g.zombies.some(z=>z.bodyBlend)||actors().some(a=>blendWeights.get(a)!==.5))throw Error("末帧过渡插值不正确");g.pause();output({status:'PASS',finalBlendHalfStep:true,nativeFrameStorageReused:true,actors:actors().length,parts:parts().length,phases,blends,interpolation:true,paused:true,rebuildPoseEqual:true,renderDidNotMutate:true,replacedPartsDuringPlayback:0,canvas:[scene.app.canvas.width,scene.app.canvas.height],maxFPS:scene.app.ticker.maxFPS,scope:'四类陆地原版全局取帧、20步姿势过渡与Scene重建；未验收真机性能'});}catch(e){fail(e)}};
document.querySelector('#mobile').onclick=()=>{host.style.width='min(100vw,390px)';host.style.height='min(75vw,292.5px)';draw()};document.querySelector('#release').onclick=async()=>{await scene.clearResources();output({status:'RELEASED',actors:scene.actors.size,pool:scene.projectilePool.length})};
}catch(e){fail(e)}
</script>
