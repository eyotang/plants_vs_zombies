<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>原始火球部件与复用验证</title>
<style>body{margin:0;background:#172719;color:#fff1c2;font:14px system-ui}header{padding:8px;display:flex;gap:8px;flex-wrap:wrap}button{min-height:44px;padding:8px}#host{width:min(100vw,800px);height:min(75vw,600px);margin:auto}textarea{width:100%}</style>
<header><button id="run" disabled>检查100帧部件动画</button><button id="reuse" disabled>检查火球复用为普通豌豆</button><button id="mobile">390像素预览</button><button id="release" disabled>释放资源</button></header><div id="host"></div><div id="result">加载中</div>
<script type="module">
import{Game}from'../src/game/model';import{Scene}from'../src/rendering/scene';import{fireAnimationTime}from'../src/game/pea-motion';
const g=new Game(9,23),scene=new Scene(),host=document.querySelector('#host'),result=document.querySelector('#result');g.phase='playing';g.started=true;g.waveIn=100000;g.seeds=['torchwood'];
const make=(fire=true)=>Array.from({length:100},(_,i)=>({id:900+i,row:Math.floor(i/20),x:100+i%20*34,originY:g.gridY(0,Math.floor(i/20))+24,age:100,ice:false,puff:false,vx:0,...(fire?{fire:true,fireAt:0,fireRate:50+i%31,fireTime:i/100}:{})}));g.peas=make();
const parts=()=>[...scene.actors.values()].flatMap(a=>a.fireRig?a.fireRig.root.children.flatMap(g=>g.children):[]);
function output(data){result.replaceChildren(...Object.entries(data).map(([key,value])=>{const line=document.createElement('textarea');line.readOnly=true;line.rows=1;line.setAttribute('aria-label',key);line.value=JSON.stringify(value);return line}));}
const draw=()=>{scene.render(g,0,1);scene.app.render();scene.app.stop()};const fail=e=>output({status:'FAIL',error:e.message,stack:e.stack});
try{await scene.init(host);await scene.prepareBoard(g,()=>{});scene.setLevel(g);await scene.prepareActors(g,()=>{});draw();document.querySelector('#run').disabled=false;document.querySelector('#reuse').disabled=false;document.querySelector('#release').disabled=false;
output({status:'READY',parts:parts().length,atlas:[scene.textures.firePea.source.pixelWidth,scene.textures.firePea.source.pixelHeight],rgba:scene.textures.firePea.source.pixelWidth*scene.textures.firePea.source.pixelHeight*4});
document.querySelector('#run').onclick=()=>{try{const before=new Set(parts()),times=[];for(let frame=0;frame<100;frame++){const start=performance.now();scene.captureMovement();for(let n=0;n<3;n++){g.step();g.drainEvents();}draw();times.push(performance.now()-start);}times.sort((a,b)=>a-b);if(parts().length!==500||!parts().every(p=>before.has(p)))throw Error('火球动画分配了新部件');output({status:'PASS',frames:100,shots:g.peas.length,parts:parts().length,replacedParts:0,meanSubmitMs:times.reduce((a,b)=>a+b)/100,p95SubmitMs:times[94],canvas:[scene.app.canvas.width,scene.app.canvas.height],maxFPS:scene.app.ticker.maxFPS,scope:'受控100个静止火球，规则推进与绘制提交；非GPU完成/真机帧率/总内存'});}catch(e){fail(e)}};
document.querySelector('#reuse').onclick=()=>{try{const before=new Set(parts());g.peas=[];draw();g.peas=make(false);draw();if([...scene.actors.values()].some(a=>a.fireRig?.root.visible||!a.art.visible))throw Error('普通豌豆显示了旧火焰');g.peas=[];draw();g.peas=make();draw();if(parts().length!==500||!parts().every(p=>before.has(p)))throw Error('对象池没有复用火球部件');g.peas[0].vx=-3.33;draw();const backward=scene.actors.get('b900').fireRig.root;if(backward.x!==41||backward.y!==-39||backward.scale.x!==-1)throw Error('反向火球原生偏移或镜像错误');g.peas[0].vx=0;draw();output({status:'PASS',pooledReuse:true,nativeMirror:true,parts:parts().length,replacedParts:0});}catch(e){fail(e)}};
document.querySelector('#mobile').onclick=()=>{host.style.width='min(100vw,390px)';host.style.height='min(75vw,292.5px)';draw()};
document.querySelector('#release').onclick=async()=>{try{const source=scene.textures.firePea.source;await scene.clearResources();if(scene.actors.size||scene.projectilePool.length||!source.destroyed)throw Error('火球资源未释放');output({status:'RELEASED',actors:scene.actors.size,pool:scene.projectilePool.length,sourceDestroyed:source.destroyed});}catch(e){fail(e)}};
}catch(e){fail(e)}
</script>
