<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>豌豆身体与开火联动检查</title>
<style>body{margin:0;background:#25291d;color:#fff1c2;font:14px system-ui}header{padding:6px;display:flex;gap:8px}button{min-height:44px;padding:8px}#host{width:min(100vw,800px);height:min(75vw,600px)}pre{white-space:pre-wrap}</style>
<header><button id="run" disabled>检查100帧开火动画</button><button id="mobile">390像素预览</button><button id="release" disabled>释放战斗资源</button></header><div id="host"></div><pre id="result">准备中</pre>
<script type="module">
import{Game}from'../src/game/model';import{Scene}from'../src/rendering/scene';import{createPeaMotion}from'../src/game/pea-motion';
const kinds=['peashooter','snowpea','repeater','gatlingpea','splitpea','threepeater'],g=new Game(9,23),scene=new Scene(),result=document.querySelector('#result'),run=document.querySelector('#run'),release=document.querySelector('#release');
g.seeds=[...kinds];g.phase='playing';g.started=true;g.waveIn=100000;
for(let row=0;row<5;row++){for(let column=0;column<8;column++){const kind=kinds[(column+row)%kinds.length],motion=createPeaMotion(kind,15+column*.6);motion.bodyTime=column/8;for(const h of motion.heads)h.time=motion.bodyTime;g.plants.push({id:100+row*10+column,kind,row,column,health:300,actionIn:column*10,born:0,shotAt:-100,peaMotion:motion});}const z=g.spawnZombie('normal',row,790,0);z.speed=0;z.health=100000;z.frozenIn=100000;}
const count=n=>1+(n.children??[]).reduce((sum,c)=>sum+count(c),0),parts=()=>[...scene.actors].filter(([k])=>k.startsWith('p')).flatMap(([,a])=>a.peaRig.root.children.flatMap(g=>g.children));
try{const start=performance.now();await scene.init(document.querySelector('#host'));await scene.prepareBoard(g,()=>{});scene.setLevel(g);await scene.prepareActors(g,()=>{});scene.app.stop();
 const draw=()=>{scene.render(g,30,1);scene.app.render();scene.app.stop()};const frame=()=>{scene.captureMovement();for(let i=0;i<3;i++){g.step();g.drainEvents();}draw()};draw();run.disabled=false;release.disabled=false;
 result.textContent=JSON.stringify({status:'READY',scope:'电脑Safari/Chrome受控场景；非iPhone真机、实时帧率、GPU完成时间或进程内存',loadMs:performance.now()-start,plants:g.plants.length,rigs:[...scene.actors.values()].filter(a=>a.peaRig).length,parts:parts().length,canvas:[scene.app.canvas.width,scene.app.canvas.height],maxFPS:scene.app.ticker.maxFPS});
 run.onclick=()=>{try{for(let i=0;i<20;i++)frame();const before=parts(),times=[];for(let i=0;i<100;i++){const start=performance.now();frame();times.push(performance.now()-start);}times.sort((a,b)=>a-b);const after=parts();if(before.length!==after.length||!after.every((p,i)=>p===before[i]))throw Error('植物动画替换了显示对象');result.textContent=JSON.stringify({status:'PASS',scope:'受控场景规则推进与绘制提交耗时，非真机帧率/GPU/进程内存',frames:100,ticks:g.ticks,plants:g.plants.length,rigs:[...scene.actors.values()].filter(a=>a.peaRig).length,parts:after.length,replacedPlantParts:0,actors:scene.actors.size,displayObjects:count(scene.world),projectiles:g.peas.length,meanMs:times.reduce((a,b)=>a+b)/100,p95Ms:times[94],canvas:[scene.app.canvas.width,scene.app.canvas.height],maxFPS:scene.app.ticker.maxFPS});}catch(e){result.textContent='FAIL '+e.stack}};
 document.querySelector('#mobile').onclick=()=>{document.querySelector('#host').style.width='min(100vw,390px)';document.querySelector('#host').style.height='min(75vw,292.5px)';draw();};
 release.onclick=async()=>{try{await scene.clearResources();run.disabled=true;release.disabled=true;result.textContent=JSON.stringify({status:'RELEASED',actors:scene.actors.size,displayObjects:count(scene.world)});}catch(e){result.textContent='FAIL '+e.stack}};
}catch(e){result.textContent='FAIL '+e.stack}
</script>
