<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>原版第二步态验证</title><style>body{margin:0;background:#172719;color:#fff1c2;font:14px system-ui}header{display:flex;gap:8px;padding:8px;flex-wrap:wrap}button{min-height:44px;padding:8px}#host{width:min(100vw,800px);height:min(75vw,600px);margin:auto}textarea{width:100%}</style><header><button id="run" disabled>核对1000步与落脚插值</button><button id="mobile">390像素预览</button><button id="release" disabled>释放资源</button></header><div id="host"></div><div id="result">加载中</div><script>addEventListener('error',e=>document.querySelector('#result').textContent='FAIL: '+e.message);</script><script type="module">
import{Game}from'../src/game/model';import{Scene}from'../src/rendering/scene';import reference from'./helpers/ground-walk2-reference.json';
let g=new Game(9,23);const scene=new Scene(),host=document.querySelector('#host'),result=document.querySelector('#result');g.phase='playing';g.started=true;g.waveIn=1e9;
for(const[i,kind]of['normal','cone','bucket','door'].entries())for(const cold of[false,true]){const z=g.spawnZombie(kind,i,630,0);z.speed=.3;z.walkVariant=2;z.walkTime=0;z.chillIn=cold?1000000:0;z.health=1000;}
const ids=g.zombies.map(z=>z.id),initial=g.snapshot(),times=new Map(),animate=scene.animate;
scene.animate=function(actor,...args){times.set(actor,{time:args[7],clip:args[0]});return animate.call(this,actor,...args)};
function output(data){result.replaceChildren(...Object.entries(data).map(([key,value])=>{const t=document.createElement('textarea');t.readOnly=true;t.rows=1;t.setAttribute('aria-label',key);t.value=JSON.stringify(value);return t}));}
function draw(alpha=1){scene.render(g,0,alpha);scene.app.render();scene.app.stop()};const actors=()=>ids.map(id=>scene.actors.get('z'+id)),parts=()=>actors().flatMap(a=>a.nativeRig.root.children.flatMap(g=>g.children));const fail=e=>output({status:'FAIL',error:e.message});
try{await scene.init(host);await scene.prepareBoard(g,()=>{});scene.setLevel(g);await scene.prepareActors(g,()=>{});draw();document.querySelector('#run').disabled=false;document.querySelector('#release').disabled=false;output({status:'READY',actors:actors().length});
document.querySelector('#run').onclick=()=>{try{g=Game.restore(structuredClone(initial));draw();const original=new Set(parts());for(let n=1;n<=1000;n++){scene.captureMovement();g.step();g.drainEvents();if(n%10===0)draw();}const zs=ids.map(id=>g.zombies.find(z=>z.id===id));for(const[i,z]of zs.entries()){const ref=reference.find(r=>r.rawStart===600&&!r.mini&&!!r.cold===!!(i%2)&&r.tick===1000);if(z.x!==ref.rawX+30||z.walkTime!==ref.time)throw Error('步速/浮点时钟未匹配独立C++算例');}
 if(actors().some(a=>!times.get(a).clip.endsWith('-walk2')))throw Error('没有使用第二套原版动作');draw(0);const before=actors().map(a=>times.get(a).time);draw(.5);const middle=actors().map(a=>times.get(a).time);draw(1);const after=actors().map(a=>times.get(a).time);if(middle.some((v,i)=>Math.abs(v-(before[i]+after[i])/2)>1e-8))throw Error('落脚动画没有与位置使用同一插值区间');if(!parts().every(p=>original.has(p)))throw Error('走路新建了部件');const saved=g.snapshot();g=Game.restore(saved);draw();if(g.zombies.some((z,i)=>z.walkTime!==saved.zombies[i].walkTime))throw Error('存档丢失落脚位置');output({status:'PASS',actors:actors().length,steps:1000,parts:parts().length,replacedParts:0,positions:zs.map(z=>z.x),times:zs.map(z=>z.walkTime),positionAndPoseInterpolation:true,savedPhaseRetained:true,canvas:[scene.app.canvas.width,scene.app.canvas.height],maxFPS:scene.app.ticker.maxFPS,scope:'四类anim_walk2受控Scene验证；非全局通关/其他动作/真机性能验收'});}catch(e){fail(e)}};
document.querySelector('#mobile').onclick=()=>{host.style.width='min(100vw,390px)';host.style.height='min(75vw,292.5px)';draw()};document.querySelector('#release').onclick=async()=>{await scene.clearResources();output({status:'RELEASED',actors:scene.actors.size,pool:scene.projectilePool.length})};
}catch(e){fail(e)}
</script>
