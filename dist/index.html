<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>后院守卫战 · 阳光旧时光</title><meta name="description" content="轻量、离线可玩的经典草坪塔防：六种植物、五路防线、冒险与无尽生存。">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-leaf">☘</span><div><b>后院守卫战</b><small>SUNSHINE · A BACKYARD STORY</small></div></div>
      <div class="resource"><span class="sun-icon">☀</span><strong id="sunCount">150</strong></div>
      <div class="wave-box"><div class="wave-copy"><span id="waveLabel">第 1 / 5 波</span><small id="enemyLabel">准备迎敌</small></div><div class="progress"><i id="progressBar"></i></div></div>
      <button id="soundBtn" class="sound-btn" aria-pressed="true">音效 开</button><button id="pauseBtn" class="icon-btn" aria-label="暂停">Ⅱ</button>
    </header>

    <section class="game-shell">
      <aside class="seed-bank" id="seedBank"></aside>
      <div class="stage-wrap">
        <canvas id="game" width="1440" height="810" aria-label="后院守卫战游戏区域"></canvas>
        <div class="tip" id="tip">选择植物，然后点击草坪种植</div>
        <div class="overlay show" id="startOverlay">
          <div class="panel hero-panel">
            <span class="eyebrow">阳 光 · 旧 时 光</span>
            <div class="hero-sun">☀</div><h1>后院守卫战</h1><h3>那年夏天，草坪还在。</h3>
            <p>熟悉的阳光，摇摆的向日葵。<br>种下你的第一道防线，守住这个小小的后院。</p>
            <div class="quick-rules"><span>☀ 点击收集阳光</span><span>🌱 先选卡牌再种植</span><span>⚒ 铲子可移除植物</span></div>
            <div class="modes"><button data-mode="adventure" class="active">经典冒险<small>五波进攻 · 渐入佳境</small></button><button data-mode="endless">无尽生存<small>持续升级 · 挑战极限</small></button></div><button class="primary" id="startBtn">开始守卫 →</button><small class="hero-note">原创致敬作品 · 无需下载 · 随时开玩</small>
          </div>
        </div>
        <div class="overlay" id="endOverlay">
          <div class="panel end-panel"><div class="end-icon" id="endIcon">🏆</div><h2 id="endTitle">守卫成功</h2><p id="endText"></p><button class="primary" id="restartBtn">再来一局</button></div>
        </div>
        <div class="pause-card" id="pauseCard"><b>游戏已暂停</b><span>点击右上角继续</span></div>
      </div>
    </section>
    <footer><span>操作：点击卡牌 → 点击草坪</span><span><kbd>1–6</kbd> 选卡 · <kbd>空格</kbd> 暂停 · <kbd>S</kbd> 铲子 · <kbd>Esc</kbd> 取消</span><button id="shovelBtn" class="shovel">⚒ 铲子</button></footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
